services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      # Unbuffered stdout/stderr so worker (child-process) log lines are
      # captured by `docker compose logs` as they happen, not at worker exit.
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./wows-gamedata:/app/wows-gamedata:ro
      - ./.git/modules/wows-gamedata:/app/.git/modules/wows-gamedata:ro
      - gamedata-cache:/root/.cache/wows-gamedata

    # Prometheus /metrics. `expose`, not `ports` — reachable from the
    # prometheus container on the compose network, never from the host or the
    # internet. Override the port with METRICS_PORT in .env (and in
    # monitoring/prometheus.yml) if 9108 collides.
    expose:
      - "9108"

    # Liveness — overrides the image HEALTHCHECK with the same semantics so
    # the check is visible in compose config even when the image cache is
    # primed separately.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time,sys; sys.exit(0 if os.path.exists('/tmp/bot_heartbeat') and time.time()-os.path.getmtime('/tmp/bot_heartbeat')<120 else 1)"
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3

    # Resource limits — cairo renders can spike RAM on high-res output, and
    # larger/longer replays (e.g. Chapaev matches) were hitting the original
    # 2G cap and triggering the cgroup OOM killer. VPS has 7.5G total with
    # ~1G used by other containers, so 4.5G (4608M — docker-compose memory
    # values must be integers) gives generous headroom for two concurrent
    # renders plus the idle bot (~1.2G).
    # `deploy.resources` works in Compose v2.20+ (non-swarm); mem_limit/cpus
    # are the legacy equivalents kept for broader compatibility.
    # The bot is the sole tenant on this VPS, so the CPU cap is set to the
    # full 4 vCPUs. With MAX_WORKERS=2, a single render can use all 4 cores
    # via libx264 auto-threading; concurrent renders timeshare via the OS
    # scheduler. Memory cap stays at 4.5G to leave the host OS comfortable.
    deploy:
      resources:
        limits:
          memory: 4608M
          cpus: "4.0"
        reservations:
          memory: 1G
    mem_limit: 4608m
    cpus: 4.0

    # Rolling logs: ~50 MB ceiling (10 MB × 5 files). Prevents disk fill from
    # render-heavy days.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # --- Monitoring ---------------------------------------------------------
  # Budget note: the host has 7.6 GB, the bot is capped at 4.5 GB and roughly
  # 1 GB goes to other containers, leaving ~2.1 GB. The pair below is capped
  # at 768 MB total so it cannot compete with a render for memory — this bot
  # has been OOM-killed before.

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Not published — Grafana reaches it over the compose network. To inspect
    # the targets page directly, use `docker compose port` or an SSH tunnel.
    expose:
      - "9090"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # This instance is loopback-only; keep it that way rather than relying
      # on anonymous access being harmless.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Mount the two provisioning subdirectories individually, NOT the whole
      # provisioning/ tree — the image ships six of them (alerting, plugins,
      # access-control, notifiers, ...) and shadowing the parent hides those,
      # making Grafana log an ERROR per missing directory on every start.
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # Bound to loopback on purpose — reach it with
    #   ssh -L 3000:localhost:3000 root@<host>
    # Change GRAFANA_ADMIN_PASSWORD before ever exposing this publicly.
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  gamedata-cache:
  prometheus-data:
  grafana-data:
